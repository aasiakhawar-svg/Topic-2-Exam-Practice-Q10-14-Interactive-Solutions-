<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topic 2 Exam Practice Q10–14 – Interactive Solutions</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2430;--mu:#5b6776;--bd:#d9e1ea;--pr:#0a8fd6;--or:#f08a24;--gr:#2e9e5b;--rd:#d64545;--pu:#7a4fd0;--sf:#eaf4fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--tx:#e8edf3;--mu:#9aa7b5;--bd:#2e3844;--sf:#16303f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--gr),var(--pr));color:#fff;padding:18px 16px}header h1{margin:0;font-size:1.3rem}header p{margin:2px 0 0;opacity:.92;font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:.88rem}
nav button.on{background:var(--or);border-color:var(--or);color:#fff}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.cc{border-left:6px solid var(--pr)}.cc h3{margin:0 0 4px;font-size:1.05rem}
h2{margin:0 0 8px;font-size:1.15rem;color:var(--or)}h2 small{color:var(--mu);font-weight:400}
.note{background:var(--sf);border-radius:8px;padding:10px;margin:6px 0}
.eq{background:var(--sf);border-left:4px solid var(--pr);padding:6px 10px;border-radius:6px;margin:6px 0;font-family:Georgia,serif}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin-top:8px}.btn:disabled{background:var(--gr);opacity:.85}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.opt.ok{background:#2e9e5b33;border-color:var(--gr)}.opt.no{background:#d6454533;border-color:var(--rd)}
.step{display:flex;gap:10px;margin:8px 0;animation:fi .5s}.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pr);color:#fff;text-align:center;font-weight:700;line-height:26px;font-size:.85rem}
.mk{background:#2e9e5b33;border-bottom:2px solid var(--gr);padding:0 2px;border-radius:3px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--tx);font-size:12px}
.vis{margin:8px 0}.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{border:1px solid var(--bd);padding:6px 4px;text-align:center}th{background:var(--sf)}tr.win,td.win{background:#2e9e5b44}
.mb{display:flex;height:34px;border-radius:8px;overflow:hidden;color:#fff;font-weight:600}.mb div{display:flex;align-items:center;justify-content:center}
.pop{animation:pop .5s both;transform-box:fill-box;transform-origin:center}
.gh{animation:gh .8s both;transform-box:fill-box;transform-origin:bottom}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes gh{from{transform:scaleY(0)}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
</style></head><body>
<header><h1>Topic 2 Exam Practice: Q10 to Q14</h1><p>Concepts first, then solve every question step by step</p></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const $=id=>document.getElementById(id);
/* ---------- visual helpers ---------- */
const mb=(a,la,lb)=>`<div class="mb"><div style="width:${a}%;background:var(--pr)">${a>14?la:""}</div><div style="width:${100-a}%;background:var(--or)">${100-a>14?lb:""}</div></div><small>${la} ${+a.toFixed(3)}% · ${lb} ${+(100-a).toFixed(3)}%</small>`;
const bx=(R,n)=>{let h=`<svg viewBox="0 0 360 ${R.length*46+6}">`;R.slice(0,n).forEach((r,i)=>{const y=6+i*46,b=r[1],e=r[2],pr=Math.max(0,e-b),un=e<=b?e:2*b-e;h+=`<text x="2" y="${y+22}" style="font-weight:700">${r[0]}</text>`;for(let k=0;k<b;k++){const x=84+k*32;h+=`<rect x="${x}" y="${y}" width="28" height="34" rx="4" fill="none" stroke="var(--mu)" stroke-width="2"/>`;const up=k<Math.min(e,b),dn=k<e-b;if(up)h+=`<text class="pop" x="${x+3}" y="${y+25}" style="fill:${dn?"var(--rd)":"var(--gr)"};font-size:19px">↑</text>`;if(dn)h+=`<text class="pop" x="${x+14}" y="${y+25}" style="fill:var(--rd);font-size:19px">↓</text>`}h+=`<text x="${84+b*32+6}" y="${y+21}" style="font-size:11px">${e} e⁻ (max ${2*b})</text>`});return h+"</svg>"};
const ato=(L,s)=>{let h='<svg viewBox="0 0 360 232">';L.forEach((a,i)=>{const cx=360/L.length*(i+.5),cy=105;h+=`<circle cx="${cx}" cy="${cy}" r="${a.r}" fill="none" stroke="var(--mu)" stroke-dasharray="4 4"/>`;for(let k=0;k<a.n;k++){const t=k*6.283/a.n;h+=`<circle cx="${cx+a.r*Math.cos(t)}" cy="${cy+a.r*Math.sin(t)}" r="5" fill="${k?"var(--pr)":"var(--or)"}"/>`}
if(s>=1)h+=`<line class="pop" x1="${cx+a.r-6}" y1="${cy}" x2="${cx+14}" y2="${cy}" stroke="var(--rd)" stroke-width="${a.w}"/>`;
h+=`<circle cx="${cx}" cy="${cy}" r="13" fill="var(--rd)"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;font-weight:700">+${a.z}</text><text x="${cx}" y="204" text-anchor="middle" style="font-weight:700">${a.l}</text>`;if(s>=2)h+=`<text class="pop" x="${cx}" y="224" text-anchor="middle" style="fill:var(--gr)">${a.t}</text>`});return h+"</svg>"};
const br=(V,L,f,hi,txt,show)=>{let h='<svg viewBox="0 0 360 230">';V.forEach((v,i)=>{const x=20+i*(320/V.length),w=320/V.length-8,H=f(v);h+=`<rect class="gh" style="animation-delay:${i*.12}s" x="${x}" y="${200-H}" width="${w}" height="${H}" rx="3" fill="${i>=hi?"var(--or)":"var(--pr)"}"/><text x="${x+w/2}" y="${194-H}" text-anchor="middle" style="font-size:10px">${v.toLocaleString("en")}</text><text x="${x+w/2}" y="215" text-anchor="middle">${L[i]}</text>`});if(show)h+=`<text class="pop" x="180" y="22" text-anchor="middle" style="fill:var(--gr);font-weight:700">${txt}</text>`;return h+"</svg>"};
const nuc=(L,hl,s)=>{let h='<svg viewBox="0 0 360 192">';L.forEach((a,i)=>{const cx=360/L.length*(i+.5),cy=76,ho=s>=1&&hl=="e";h+=`<circle cx="${cx}" cy="${cy}" r="62" fill="none" stroke="${ho?"var(--or)":"var(--mu)"}" stroke-width="${ho?3:1}" stroke-dasharray="4 4"/>`;
for(let k=0;k<a[3];k++){const t=k*6.283/a[3];h+=`<circle cx="${cx+62*Math.cos(t)}" cy="${cy+62*Math.sin(t)}" r="3.5" fill="var(--pr)"/>`}
for(let k=0;k<a[1]+a[2];k++){const r=6*Math.sqrt(k+.5),t=k*2.4,p=k<a[1];h+=`<circle class="pop" style="animation-delay:${(k%12)*.05}s" cx="${cx+r*Math.cos(t)}" cy="${cy+r*Math.sin(t)}" r="5.5" fill="${p?"var(--rd)":"#8a94a0"}" stroke="${s>=1&&hl==(p?"p":"n")?"var(--or)":"none"}" stroke-width="2"/>`}
h+=`<text x="${cx}" y="158" text-anchor="middle" style="font-weight:700">${a[0]}</text><text x="${cx}" y="173" text-anchor="middle" style="font-size:11px">p ${a[1]} · n ${a[2]} · e⁻ ${a[3]}</text>`});
return h+`<text x="180" y="189" text-anchor="middle" style="font-size:10px">red = proton · grey = neutron · blue dots = electrons · orange = what differs</text></svg>`};
const sp=(s,f)=>{const X=m=>20+(m-30)*7,P=[[70,9,"³⁵Cl₂⁺"],[72,6,"³⁵Cl³⁷Cl⁺"],[74,1,"³⁷Cl₂⁺"]];if(f)P.push([35,3,"³⁵Cl⁺"],[37,1,"³⁷Cl⁺"]);let h='<svg viewBox="0 0 360 215"><line x1="15" y1="175" x2="350" y2="175" stroke="var(--mu)"/>';
P.forEach(p=>{const fr=p[0]<50;if(fr&&s<1)return;const H=p[1]*12;h+=`<rect class="gh" x="${X(p[0])-2}" y="${175-H}" width="5" height="${H}" fill="${fr?"var(--or)":"var(--pr)"}"/><text x="${X(p[0])}" y="190" text-anchor="middle" style="font-size:10px">${p[0]}</text>`;
if(s>=(f?2:1))h+=`<text class="pop" transform="rotate(-90 ${X(p[0])+4} ${170-H})" x="${X(p[0])+4}" y="${170-H}" style="font-size:10px">${p[2]}</text>`});return h+'<text x="190" y="209" text-anchor="middle">m/z</text></svg>'};
const shp=s=>{let h='<svg viewBox="0 0 360 180"><circle class="pop" cx="90" cy="80" r="44" fill="var(--pr)" fill-opacity=".45" stroke="var(--pr)" stroke-width="2"/><circle cx="90" cy="80" r="4" fill="var(--rd)"/><text x="90" y="154" text-anchor="middle" style="font-weight:700">s orbital: spherical</text>';
if(s>=1){[[0,"var(--rd)"],[90,"var(--gr)"],[-45,"var(--or)"]].forEach(([r,c])=>{h+=`<g class="pop" transform="rotate(${r} 270 80)"><ellipse cx="240" cy="80" rx="30" ry="12" fill="${c}" fill-opacity=".5" stroke="${c}"/><ellipse cx="300" cy="80" rx="30" ry="12" fill="${c}" fill-opacity=".5" stroke="${c}"/></g>`});h+='<circle cx="270" cy="80" r="3" fill="var(--rd)"/><text x="270" y="154" text-anchor="middle" style="font-weight:700">p orbitals: dumbbells</text><text x="270" y="170" text-anchor="middle" style="font-size:10px">3 orbitals at right angles (x, y, z)</text>'}return h+"</svg>"};
const tb=(H,R)=>`<div class="sc"><table><tr>${H.map(x=>`<th>${x}</th>`).join("")}</tr>${R.join("")}</table></div>`;
const t10=s=>{const R=[["proton","var(--rd)","+1","1"],["neutron","#8a94a0","0","1"],["electron","var(--pr)","−1","1/1836 (≈ 0)"]];return tb(["Particle","Relative charge","Relative mass"],R.map((r,i)=>`<tr><td><span style="color:${r[1]}">●</span> ${r[0]}</td>`+(s>=i+1?`<td class="pop win">${r[2]}</td><td class="pop win">${r[3]}</td>`:"<td>?</td><td>?</td>")+"</tr>"))};
const tcfg=s=>{const R=[["Na","Z = 11 → 11","1s² 2s² 2p⁶ 3s¹"],["O²⁻","8 + 2 = 10","1s² 2s² 2p⁶"],["Mg²⁺","12 − 2 = 10","1s² 2s² 2p⁶"],["Cl","Z = 17 → 17","1s² 2s² 2p⁶ 3s² 3p⁵"]];return tb(["Species","Electrons","Configuration"],R.map((r,i)=>`<tr><td><b>${r[0]}</b></td>`+(s>=i+1?`<td>${r[1]}</td><td class="pop win">${r[2]}</td>`:"<td>?</td><td>?</td>")+"</tr>"))};
const t11=s=>{const R=[["NH₄⁺","7 + 4 − 1 = 10"],["P³⁻","15 + 3 = 18"],["S²⁻","16 + 2 = 18"],["Cl⁻","17 + 1 = 18"]];return tb(["Ion","Electrons"],R.map((r,i)=>`<tr class="${s>=2&&!i?"win":""}"><td><b>${r[0]}</b></td><td>${s>=1?r[1]:"?"}</td></tr>`))};
/* ---------- questions (numbered from 10) ---------- */
const Q=[
{t:"Sub-atomic particles, isotopes and ions",m:6,tx:"(a) Complete the table of the three major sub-atomic particles. (b) Each pair differs only in the number of protons, neutrons or electrons: state the difference. (The page shows ⁹K⁺, read here as ³⁹K⁺.)",p:[
{q:"(a) Complete the table showing relative charge and relative mass. [3]",v:t10,s:["Three particles: protons (red), neutrons (grey), electrons (blue). Values are relative to the proton.","<b>Proton:</b> charge <span class=mk>+1</span>, mass <span class=mk>1</span>.","<b>Neutron:</b> charge <span class=mk>0</span>, mass <span class=mk>1</span>.","<b>Electron:</b> charge <span class=mk>−1</span>, mass <span class=mk>1/1836</span> (almost zero)."]},
{q:"(b)(i) ¹⁶O and ¹⁷O",v:s=>nuc([["¹⁶O",8,8,8],["¹⁷O",8,9,8]],"n",s),s:["Oxygen has 8 protons. ¹⁶O has 16 − 8 = 8 neutrons; ¹⁷O has 17 − 8 = 9 neutrons. Both have 8 electrons.","They differ only in the <span class=mk>number of neutrons</span> (isotopes)."]},
{q:"(b)(ii) ²⁴Mg and ²⁴Mg²⁺",v:s=>nuc([["²⁴Mg",12,12,12],["²⁴Mg²⁺",12,12,10]],"e",s),s:["Both have 12 protons and 12 neutrons. A 2+ ion has lost 2 electrons: 12 becomes 10.","They differ only in the <span class=mk>number of electrons</span>."]},
{q:"(b)(iii) ³⁹K⁺ and ⁴⁰Ca²⁺ [3 marks for (b)]",v:s=>nuc([["³⁹K⁺",19,20,18],["⁴⁰Ca²⁺",20,20,18]],"p",s),s:["K: 19 protons, 39 − 19 = 20 neutrons, K⁺ has 18 electrons. Ca: 20 protons, 40 − 20 = 20 neutrons, Ca²⁺ has 18 electrons.","Neutrons and electrons match, so they differ only in the <span class=mk>number of protons</span> (19 and 20)."]}]},
{t:"Orbitals and electronic configurations",m:11,tx:"Questions on orbitals, sub-shells, and the configurations of atoms and ions.",p:[
{q:"(a) State what is meant by an orbital. [2]",v:()=>bx([["1 orbital",1,2]],1),s:["An orbital is a <span class=mk>region of space around the nucleus</span> where there is a high probability of finding an electron.","It can hold a <span class=mk>maximum of two electrons</span>, which must have opposite spins (↑↓)."]},
{q:"(b) Draw the shapes of (i) an s-orbital and (ii) a p-orbital. [2]",v:shp,s:["<b>s-orbital:</b> a <span class=mk>sphere</span> centred on the nucleus.","<b>p-orbital:</b> a <span class=mk>dumbbell</span> (two lobes either side of the nucleus). There are three p-orbitals, at right angles to each other."]},
{q:"(c) How many electrons can occupy (i) an s-orbital, (ii) a p-sub-shell? [2]",v:s=>bx([["s orbital",1,2],["p sub-shell",3,6]],[1,2][s]),s:["(i) One orbital holds <span class=mk>2 electrons</span>.","(ii) A p sub-shell has 3 orbitals, so 3 × 2 = <span class=mk>6 electrons</span>."]},
{q:"(d) Give the electronic configurations of (i) Na, (ii) O²⁻, (iii) Mg²⁺, (iv) Cl. [4]",v:tcfg,s:["First count the electrons: atoms have Z electrons; negative ions gain electrons, positive ions lose them. Fill 1s, 2s, 2p, 3s, 3p in order.","<b>Na</b> (11 e⁻): <span class=mk>1s² 2s² 2p⁶ 3s¹</span>.","<b>O²⁻</b> (8 + 2 = 10 e⁻): <span class=mk>1s² 2s² 2p⁶</span>.","<b>Mg²⁺</b> (12 − 2 = 10 e⁻): <span class=mk>1s² 2s² 2p⁶</span> (same as O²⁻: isoelectronic).","<b>Cl</b> (17 e⁻): <span class=mk>1s² 2s² 2p⁶ 3s² 3p⁵</span>."]},
{q:"(e) Which of these ions contains the fewest electrons? [1]",o:["NH₄⁺","P³⁻","S²⁻","Cl⁻"],a:0,v:t11,s:["Electrons = total protons of the atoms − charge (a negative charge adds electrons, a positive charge removes them).","NH₄⁺: 7 + 4 − 1 = 10. P³⁻: 15 + 3 = 18. S²⁻: 16 + 2 = 18. Cl⁻: 17 + 1 = 18.","The fewest is 10, so the answer is <b>A (NH₄⁺)</b>."]}]},
{t:"Mass spectrum of chlorine",m:8,tx:"Chlorine has two isotopes, ³⁵Cl and ³⁷Cl. The diagram shows part of the mass spectrum: peaks at m/z 70 (relative abundance 9), 72 (6) and 74 (1).",p:[
{q:"(a) Give the formula of the species responsible for each peak at m/z 70, 72 and 74. [3]",v:s=>sp(s,0),s:["Peaks at 70 to 74 are about twice the mass of one Cl atom, so they are <b>molecular ions</b>, Cl₂⁺ (two atoms).","Add up the isotope masses: 35+35 = 70, 35+37 = 72, 37+37 = 74.","<span class=mk>70: ³⁵Cl₂⁺</span> · <span class=mk>72: ³⁵Cl³⁷Cl⁺</span> · <span class=mk>74: ³⁷Cl₂⁺</span>"]},
{q:"(b) Give the m/z of the two other peaks, the species responsible, and their relative abundances. [5]",v:s=>sp(s,1),s:["The Cl₂ molecule can also break up, giving <b>single-atom ions</b> Cl⁺, which have the mass of one atom: m/z <span class=mk>35</span> and <span class=mk>37</span>.","Species: <span class=mk>³⁵Cl⁺ at m/z 35</span> and <span class=mk>³⁷Cl⁺ at m/z 37</span>.","Abundance: from 9 : 6 : 1, ³⁵Cl atoms = 2×9 + 6 = 24 and ³⁷Cl atoms = 6 + 2×1 = 8, so ³⁵Cl : ³⁷Cl = <span class=mk>3 : 1</span> (75% : 25%). Peak at 35 has abundance 3, peak at 37 has abundance 1."]}]},
{t:"Ionisation energies of Na, Mg and Al",m:8,tx:"First four ionisation energies (kJ mol⁻¹): Na 496, 4563, 6913, 9544. Mg 738, 1451, 7733, 10 541. Al 578, 1817, 2745, 11 578. Explain why…",p:[
{q:"(a) the first IE of sodium is lower than that of magnesium. [2]",v:s=>ato([{l:"Na 3s¹ (+11)",z:11,r:62,n:1,w:3,t:"weaker pull"},{l:"Mg 3s² (+12)",z:12,r:52,n:2,w:5,t:"stronger pull"}],s),s:["Both outer electrons are in the 3s sub-shell (same shell, similar shielding by 10 inner electrons).","Magnesium has a <span class=mk>greater nuclear charge</span> (+12 vs +11), so a stronger attraction.","More energy is needed to remove Mg’s electron: 738 &gt; 496."]},
{q:"(b) the first IE of magnesium is higher than that of aluminium. [2]",v:s=>ato([{l:"Mg 3s² (+12)",z:12,r:50,n:2,w:5,t:"3s: lower energy"},{l:"Al 3p¹ (+13)",z:13,r:66,n:1,w:2,t:"3p: higher, shielded"}],s),s:["Mg loses an electron from <b>3s</b>; Al loses one from <b>3p</b>.","The 3p sub-shell is <span class=mk>higher in energy</span> (further out) and the 3p electron is <span class=mk>shielded by the 3s² electrons</span>.","These outweigh Al’s extra proton, so Al’s outer electron is easier to remove: 578 &lt; 738."]},
{q:"(c) the second IE of magnesium is lower than that of aluminium. [2]",v:s=>br([1451,1817],["Mg 2nd","Al 2nd"],v=>v/1817*150,1,"Al needs more energy",s>=2),s:["The 2nd IE removes an electron from a 1+ ion. Mg⁺ is 1s² 2s² 2p⁶ 3s¹ and Al⁺ is 1s² 2s² 2p⁶ 3s².","In both ions the electron comes from the 3s sub-shell, with the same inner shielding.","Al has the <span class=mk>greater nuclear charge</span> (+13 vs +12), so a stronger attraction outweighing the extra 3s repulsion. More energy is needed: 1817 &gt; 1451."]},
{q:"(d) the fourth IE of aluminium is higher than its third IE. [2]",v:s=>br([578,1817,2745,11578],["1st","2nd","3rd","4th"],v=>v/11578*165,3,"Huge jump: new inner shell",s>=1),s:["Aluminium is 1s² 2s² 2p⁶ 3s² 3p¹: three electrons in the 3rd shell. The 3rd IE removes the last of them.","The 4th electron comes from the <span class=mk>2nd shell (2p⁶)</span>: closer to the nucleus and less shielded, so it is much <span class=mk>lower in energy</span> and needs far more energy: 11 578 &gt; 2745."]}]},
{t:"Lithium isotopes",m:10,tx:"Lithium (s-block) is a mixture of ⁶Li and ⁷Li. A sample contains 7.59% ⁶Li and 92.41% ⁷Li. ⁷Li has relative isotopic mass 7.016 and ⁶Li has 6.015.",p:[
{q:"(a) Complete the table: protons, neutrons and electrons in each isotope. [2]",v:s=>nuc([["⁶Li",3,3,3],["⁷Li",3,4,3]],"n",s),s:["Lithium has atomic number 3, so both isotopes have <span class=mk>3 protons</span> and <span class=mk>3 electrons</span>. Neutrons = mass number − 3.","<b>⁶Li:</b> 3 p, <span class=mk>3 n</span>, 3 e⁻. <b>⁷Li:</b> 3 p, <span class=mk>4 n</span>, 3 e⁻."]},
{q:"(b)(i) Name the instrument used to determine this information. [1]",s:["A <span class=mk>mass spectrometer</span>, which separates ions by m/z and measures their relative abundances."]},
{q:"(b)(ii) State what is meant by relative isotopic mass. [2]",s:["The mass of <span class=mk>one atom of an isotope</span> compared with <span class=mk>1/12 of the mass of one atom of carbon-12</span>."]},
{q:"(b)(iii) Calculate the relative atomic mass of lithium to 3 significant figures. [2]",v:()=>mb(7.59,"⁶Li","⁷Li"),s:["Weighted mean: Ar = Σ(isotopic mass × abundance) ÷ 100.","Ar = (6.015 × 7.59 + 7.016 × 92.41) ÷ 100 = (45.65 + 648.35) ÷ 100 = 6.940","Ar = <span class=mk>6.94</span> (3 s.f.), close to 7 because ⁷Li is the majority isotope."]},
{q:"(c)(i) Give the electronic configuration of a lithium atom. [1]",s:["3 electrons: 2 fill 1s, 1 goes into 2s. <b>1s² 2s¹</b>"]},
{q:"(c)(ii) State why lithium is described as an s-block element. [1]",s:["Its <span class=mk>outermost (highest-energy) electron is in an s sub-shell</span> (2s)."]},
{q:"(c)(iii) Would you expect the two isotopes to have the same chemical properties? Justify. [1]",s:["<span class=mk>Yes</span>: chemical properties depend on the electrons (same electronic configuration, 1s² 2s¹). The isotopes differ only in neutrons, which do not affect chemical behaviour."]}]}];
/* ---------- primer ---------- */
const C=[["var(--pr)","1. Sub-atomic particles, isotopes and ions","<div class=vis>"+t10(3)+"</div>Isotopes differ in <b>neutrons</b>; an atom and its ion differ in <b>electrons</b>; different elements differ in <b>protons</b>. Neutrons = mass number − atomic number. Used in Q10, Q14a."],
["var(--gr)","2. Orbitals and electronic configurations","An <b>orbital</b> holds up to 2 electrons (opposite spins). s: 1 orbital (2 e⁻); p: 3 orbitals (6 e⁻).<div class=vis>"+shp(1)+"</div>Fill in the order 1s 2s 2p 3s 3p. Ions: add electrons for negative charges, remove them for positive ones. Used in Q11, Q14c."],
["var(--or)","3. Reading a mass spectrum","Peaks are m/z values. Cl₂⁺ molecular ions give peaks at 70, 72, 74 (9 : 6 : 1). Cl⁺ fragments give peaks at 35 and 37 in the ratio of the isotope abundances (3 : 1). Used in Q12."],
["var(--rd)","4. Ionisation energy trends and anomalies","Three factors: nuclear charge, shielding, and the sub-shell the electron leaves. Na → Mg rises (more protons, same 3s). Mg → Al falls (3p is higher than 3s and shielded). A huge jump in successive IEs means an electron from an inner shell. Used in Q13."],
["var(--pu)","5. Relative isotopic mass and Ar","Relative isotopic mass: mass of an isotope’s atom compared with 1/12 of a ¹²C atom.<div class=eq>Ar = Σ(isotopic mass × abundance) ÷ 100</div>Isotopes have the same chemical properties because they have the same electrons. Used in Q14b–c."]];
/* ---------- engine ---------- */
const S={},off=9;
const names=["📘 Concepts"].concat(Q.map((q,i)=>"Q"+(i+1+off)));
names.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>go(i);$("nav").append(b)});
function go(i){[...$("nav").children].forEach((b,j)=>b.classList.toggle("on",i==j));let h="";
if(!i){h=C.map(c=>`<div class="card cc" style="border-left-color:${c[0]}"><h3>${c[1]}</h3>${c[2]}</div>`).join("")+`<button class="btn" onclick="go(1)">Start solving Q10 →</button>`}
else{const q=Q[i-1];h=`<div class="card"><h2>Q${i+off}. ${q.t} <small>[${q.m} marks]</small></h2><div class="note">${q.tx}</div></div>`;
q.p.forEach((p,j)=>{h+=`<div class="card"><b>${p.q}</b>`+(p.o?p.o.map((o,k)=>`<button class="opt" onclick="pick(${i},${j},${k},this)">${"ABCD"[k]}&nbsp; ${o}</button>`).join(""):"")+`<div class="note" id="f${i}_${j}" style="display:none"></div>`+(p.v?`<div class="vis" id="v${i}_${j}">${p.v(0)}</div>`:"")+`<div id="s${i}_${j}"></div><button class="btn" id="b${i}_${j}" onclick="nx(${i},${j})">Show step 1 of ${p.s.length}</button></div>`});
h+=`<button class="btn" onclick="go(${i<Q.length?i+1:0})">${i<Q.length?"Next question →":"Back to concepts"}</button>`}
$("m").innerHTML=h;window.scrollTo(0,0)}
function pick(i,j,k,b){const p=Q[i-1].p[j],o=b.parentNode.querySelectorAll(".opt");o.forEach(x=>x.disabled=true);o[p.a].classList.add("ok");if(k!=p.a)b.classList.add("no");const f=$("f"+i+"_"+j);f.style.display="block";f.innerHTML=k==p.a?"✅ Correct! Now see the reasoning step by step.":"❌ Not quite. The correct option is highlighted. Step through the reasoning below."}
function nx(i,j){const key=i+"_"+j,p=Q[i-1].p[j],k=S[key]||0;if(k>=p.s.length)return;$("s"+key).insertAdjacentHTML("beforeend",`<div class="step"><span class="n">${k+1}</span><div>${p.s[k]}</div></div>`);if(p.v)$("v"+key).innerHTML=p.v(k);S[key]=k+1;const b=$("b"+key);if(k+1>=p.s.length){b.textContent="Solved ✔";b.disabled=true}else b.textContent=`Show step ${k+2} of ${p.s.length}`}
go(0);
</script></body></html>
